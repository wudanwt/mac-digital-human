[project]
name = "mac-digital-human"
version = "0.3.0"
description = "Apple Silicon local digital-human production pipeline for MuseTalk and CosyVoice 2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
  "huggingface-hub>=0.34",
  "pydantic>=2.11",
  "rich>=14.0",
  "psutil>=6.0",
  "python-pptx>=1.0.2",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
cosyvoice = [
  "torch>=2.3.0",
  "torchaudio>=2.3.0",
  "conformer>=0.3.2",
  "diffusers>=0.29.0",
  "hydra-core>=1.3.2",
  "HyperPyYAML>=1.2.3",
  "inflect>=7.3.1",
  "librosa>=0.10.2",
  "lightning>=2.2.4",
  "modelscope",
  "omegaconf>=2.3.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "openai-whisper>=20231117",
  "pyworld>=0.3.4",
  "setuptools<72",
  "soundfile>=0.12.0",
  "transformers>=4.48",
  "wetext>=0.0.4",
  "x-transformers>=2.11.24",
]
dev = [
  "pytest>=8",
]

[project.scripts]
mac-avatar = "app.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
