[project]
name = "mac-digital-human"
version = "0.1.0"
description = "Apple Silicon local digital human orchestration for MuseTalk-MLX"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
  "huggingface-hub>=0.34",
  "pydantic>=2.11",
  "rich>=14.0",
]

[project.scripts]
mac-avatar = "app.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
