[project]
name = "mac-digital-human"
version = "0.3.0"
description = "Apple Silicon local digital-human production pipeline for MuseTalk, LongCat and MLX-Audio"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
  "huggingface-hub>=0.34",
  "pydantic>=2.11",
  "rich>=14.0",
  "psutil>=6.0",
]

[project.optional-dependencies]
longcat = [
  "transformers>=4.48",
  "librosa>=0.11",
  "Pillow>=10",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "mlx-arsenal",
]
dev = [
  "pytest>=8",
]

[project.scripts]
mac-avatar = "app.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
