# Local/acceptance stack only. Production must use managed/private credentials,
# object storage, TLS reverse proxy and SAAS_ENV=production validation.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SAAS_DB_NAME:-digital_human}
      POSTGRES_USER: ${SAAS_DB_USER:-digital_human}
      POSTGRES_PASSWORD: ${SAAS_DB_PASSWORD:-local-dev-only-password}
    ports:
      - "127.0.0.1:${SAAS_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - saas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SAAS_DB_USER:-digital_human} -d ${SAAS_DB_NAME:-digital_human}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SAAS_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - saas-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.saas-api
    env_file:
      - .env.saas
    environment:
      DATABASE_URL: postgresql+psycopg://${SAAS_DB_USER:-digital_human}:${SAAS_DB_PASSWORD:-local-dev-only-password}@postgres:5432/${SAAS_DB_NAME:-digital_human}
      REDIS_URL: redis://redis:6379/0
      WORKER_BACKEND: redis
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/workspace/saas-assets
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.saas_main:app --host 0.0.0.0 --port 8918 --proxy-headers"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8918:8918"
    volumes:
      - ${SAAS_SHARED_WORKSPACE_DIR:-./workspace}:/app/workspace
      - ${SAAS_SHARED_OUTPUTS_DIR:-./outputs}:/app/outputs
    restart: unless-stopped

  worker-mock:
    build:
      context: .
      dockerfile: Dockerfile.saas-api
    env_file:
      - .env.saas
    environment:
      DATABASE_URL: postgresql+psycopg://${SAAS_DB_USER:-digital_human}:${SAAS_DB_PASSWORD:-local-dev-only-password}@postgres:5432/${SAAS_DB_NAME:-digital_human}
      REDIS_URL: redis://redis:6379/0
      WORKER_BACKEND: redis
      SAAS_RENDERER: mock
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/workspace/saas-assets
    command: ["python", "-m", "app.saas.worker_entry"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${SAAS_SHARED_WORKSPACE_DIR:-./workspace}:/app/workspace
      - ${SAAS_SHARED_OUTPUTS_DIR:-./outputs}:/app/outputs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=2, socket_timeout=2).ping()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    profiles: ["mock-worker"]

volumes:
  saas-postgres:
  saas-redis:
