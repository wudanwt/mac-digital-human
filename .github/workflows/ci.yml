name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: digital_human_test
          POSTGRES_USER: digital_human
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U digital_human -d digital_human_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://digital_human:ci-postgres-password@127.0.0.1:5432/digital_human_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SAAS_ENV: development
      WORKER_BACKEND: redis
      STORAGE_BACKEND: local
      SAAS_JWT_SECRET: ci-test-secret-not-for-production-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[saas,dev]'
      - name: Compile
        run: python -m compileall -q app scripts migrations
      - name: Shell syntax
        run: |
          bash -n scripts/saas/start_mlx_worker_mac.sh
          bash -n scripts/saas/start_distributed_center.sh
          bash -n scripts/saas/start_remote_page_worker_mac.sh
      - name: Browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.saas.avatar_ui import JS as avatar_js
          from app.saas.avatar_matting_ui import JS as avatar_matting_js
          from app.saas.product_ui import JS as product_js
          from app.saas.operations_ui import JS as operations_js
          from app.saas.polish_ui import JS as polish_js
          from app.saas.interaction_patch import JS as interaction_js
          from app.saas.course_studio_ui import JS as course_studio_js
          from app.saas.course_studio_upgrade import JS as course_studio_upgrade_js
          from app.saas.course_studio_asset_picker_ui import JS as course_studio_asset_picker_js
          from app.saas.course_avatar_mode_ui import JS as course_avatar_mode_js
          from app.saas.course_voice_ui import JS as course_voice_js
          from app.saas.worker_ui import JS as worker_ui_js
          modules = {
              'avatar-ui': avatar_js,
              'avatar-matting': avatar_matting_js,
              'product-ui': product_js,
              'operations-ui': operations_js,
              'polish-ui': polish_js,
              'interaction-patch': interaction_js,
              'course-studio': course_studio_js,
              'course-studio-upgrade': course_studio_upgrade_js,
              'course-studio-asset-picker': course_studio_asset_picker_js,
              'course-avatar-mode': course_avatar_mode_js,
              'course-voice': course_voice_js,
              'worker-ui': worker_ui_js,
          }
          for name, source in modules.items():
              Path(f'/tmp/{name}.js').write_text(source, encoding='utf-8')
          PY
          for file in /tmp/avatar-ui.js /tmp/avatar-matting.js /tmp/product-ui.js /tmp/operations-ui.js /tmp/polish-ui.js /tmp/interaction-patch.js /tmp/course-studio.js /tmp/course-studio-upgrade.js /tmp/course-studio-asset-picker.js /tmp/course-avatar-mode.js /tmp/course-voice.js /tmp/worker-ui.js; do
            node --check "$file"
          done
      - name: Migration smoke test on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade 0001_initial_saas
          alembic upgrade head
      - name: Test PostgreSQL + Redis control plane
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.saas.example .env.saas
          docker compose --env-file .env.saas -f docker-compose.saas.yml config >/dev/null
      - name: Build SaaS API image
        run: docker build -f Dockerfile.saas-api -t digital-human-saas:ci .
