name: CI

on:
  push:
    branches: [main, feat/saas-cloud]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: digital_human_test
          POSTGRES_USER: digital_human
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U digital_human -d digital_human_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://digital_human:ci-postgres-password@127.0.0.1:5432/digital_human_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SAAS_ENV: development
      WORKER_BACKEND: redis
      STORAGE_BACKEND: local
      SAAS_JWT_SECRET: ci-test-secret-not-for-production-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[saas,dev]'
      - name: Compile
        run: python -m compileall -q app scripts migrations
      - name: Migration smoke test on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade 0001_initial_saas
          alembic upgrade head
      - name: Test PostgreSQL + Redis control plane
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SaaS API image
        run: docker build -f Dockerfile.saas-api -t digital-human-saas:ci .
