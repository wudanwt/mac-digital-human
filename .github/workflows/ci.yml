name: CI

on:
  push:
    branches: [main, feat/saas-cloud]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[saas,dev]'
      - name: Compile
        run: python -m compileall -q app scripts migrations
      - name: Test
        env:
          SAAS_ENV: development
          WORKER_BACKEND: local
          STORAGE_BACKEND: local
          SAAS_JWT_SECRET: ci-test-secret-not-for-production-1234567890
        run: pytest -q
